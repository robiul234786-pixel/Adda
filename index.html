<!doctype html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>আড্ডা</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#101a2b">
<style>
:root{--bg:#101a2b;--cd:#17233a;--bd:#25344f;--tx:#eef2f8;--mu:#8fa0bd;--ac:#ffb020;--lk:#ff5a6e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#eef2f8;--cd:#fff;--bd:#d9e1ee;--tx:#14213a;--mu:#5d6b86;color-scheme:light}}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 "Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif}
#app{max-width:560px;margin:0 auto;padding:14px 14px 96px}
h1{font-size:26px;margin:4px 0 14px}
button{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:8px 14px;cursor:pointer}
button:active{transform:scale(.96)}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.pri{background:var(--ac);color:#241800;border-color:var(--ac);font-weight:700}
textarea,input{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
textarea{resize:none;height:84px}
.box{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center}.sp{justify-content:space-between}
.av{flex:none;display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:50%;font-weight:700;color:#10161f;font-size:19px}
.hd{display:flex;gap:10px;align-items:center;cursor:pointer}.hd small{display:block;color:var(--mu);font-size:13px;line-height:1.2}
.pc p{margin:10px 0 8px;white-space:pre-wrap;word-break:break-word}
.pc footer{display:flex;gap:8px;margin-top:8px}.pc footer button{padding:5px 12px;font-size:15px}.lk{border-color:var(--lk);color:var(--lk)}
.nw{cursor:pointer;margin:6px 0 0}.art{margin-top:8px;border-top:1px solid var(--bd);padding-top:8px}.art p{margin:0 0 8px;font-size:15px}
.cm{margin-top:10px;border-top:1px solid var(--bd);padding-top:10px}.cm .c{display:flex;gap:8px;margin-bottom:8px;font-size:15px}
.mu{color:var(--mu);font-size:14px}
.st{display:flex;gap:18px;margin:10px 0}.st b{display:block;font-size:20px}.st span{font-size:13px;color:var(--mu)}
.fl{background:transparent}.fl.on{background:var(--ac);color:#241800;border-color:var(--ac)}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:2px;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:var(--cd);border-top:1px solid var(--bd)}
#nav button{flex:1;max-width:110px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--mu);padding:4px}
#nav button span{font-size:22px;line-height:1.1}#nav button.on{color:var(--ac);font-weight:700}
.sw{display:flex;gap:10px;margin:12px 0}.sw i{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent}.sw i.on{border-color:var(--tx)}
.hero{text-align:center;padding:30px 8px 10px}.hero .big{font-size:54px;font-weight:800;color:var(--ac);line-height:1}
.ms{display:flex;gap:8px;margin-bottom:10px}.ms>div{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:6px 12px;max-width:80%;word-break:break-word}.ms.me{flex-direction:row-reverse}.ms.me>div{background:var(--ac);color:#241800;border-color:var(--ac)}
.er{color:var(--lk);font-size:14px;margin:0 0 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head><body><div id="app"></div><div id="nav"></div>
<script>
const FB='';
const $=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bd=n=>String(n).replace(/\d/g,c=>'০১২৩৪৫৬৭৮৯'[c]),K='adda2',COL=['#ff7a59','#2dd4bf','#a78bfa','#fbbf24','#60a5fa','#f472b6'],OK=c=>/^#[0-9a-f]{6}$/i.test(c)?c:'#8fa0bd';
let D={};try{D=JSON.parse(localStorage.getItem(K))||{}}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
const fbu=()=>{let v=FB;if(!v)try{v=localStorage.getItem('adda_fb')||''}catch(e){}return v};
let FD={users:{},posts:{},news:{},likes:{},comments:{},follows:{},chat:{}},SJ='',DT=0,T='feed',V='',CM='',OP='',NC=COL[0],NE='';
const api=(p,m,b,q)=>fetch(fbu()+'/social/'+p+'.json'+(q||''),{method:m||'GET',body:b===undefined?undefined:JSON.stringify(b)}).then(r=>{if(!r.ok)throw 0;return r.json()});
const Q='?orderBy='+encodeURIComponent('"$key"')+'&limitToLast=';
const typing=()=>{const a=document.activeElement;return!!(a&&/INPUT|TEXTAREA/.test(a.tagName))};
const err=()=>{NE='পাঠানো যায়নি, আবার চেষ্টা করুন';R()};
const rid=()=>Date.now()+Math.random().toString(36).slice(2,5);
const ago=t=>{const s=Math.max(0,(Date.now()-t)/1000|0);if(s<60)return'এইমাত্র';const m=s/60|0;if(m<60)return bd(m)+' মিনিট আগে';const h=m/60|0;if(h<24)return bd(h)+' ঘণ্টা আগে';return bd(h/24|0)+' দিন আগে'};
const lk=id=>FD.likes[id]||{},cs=id=>Object.values(FD.comments[id]||{}).filter(c=>c&&c.x).sort((a,b)=>a.t-b.t),fl=u=>Object.keys(FD.follows[u]||{}),fers=u=>Object.keys(FD.follows).filter(k=>FD.follows[k]&&FD.follows[k][u]);
const AV=(n,c,s)=>`<span class="av" style="background:${OK(c)}${s?`;width:${s}px;height:${s}px;font-size:${s*.45}px`:''}">${E([...String(n||'?')][0])}</span>`;
const who=u=>{const x=FD.users[u];if(x)return x;const p=Object.values(FD.posts).find(z=>z&&z.u===u);return p?{n:p.n,c:p.c}:{n:'বন্ধু',c:'#8fa0bd'}};
function setFb(){const v=($('#fbu').value||'').trim().replace(/\/+$/,'');if(!/^https:\/\/[\w.-]+\.(firebaseio\.com|firebasedatabase\.app)$/.test(v)){alert('লিংকটা ঠিক নয়');return}try{localStorage.setItem('adda_fb',v)}catch(e){}NE='';R();pull()}
function join(){const n=($('#nm').value||'').trim().slice(0,20);if(!n){$('#nm').focus();return}const me='u'+rid();D={me,n,c:NC};save();FD.users[me]={n,c:NC};R();api('users/'+me,'PUT',{n,c:NC,t:Date.now()}).catch(err)}
function post(){const x=($('#px').value||'').trim().slice(0,280);if(!x)return;const id='k'+rid(),o={u:D.me,n:D.n,c:D.c,x,t:Date.now()};FD.posts[id]=o;R();api('posts/'+id,'PUT',o).catch(err)}
function like(id){const L=FD.likes[id]=FD.likes[id]||{},p='likes/'+id+'/'+D.me;if(L[D.me]){delete L[D.me];api(p,'DELETE').catch(err)}else{L[D.me]=true;api(p,'PUT',true).catch(err)}R()}
function say(id){const x=($('#ci').value||'').trim().slice(0,200);if(!x)return;const k='k'+rid(),o={u:D.me,n:D.n,c:D.c,x,t:Date.now()};(FD.comments[id]=FD.comments[id]||{})[k]=o;R();api('comments/'+id+'/'+k,'PUT',o).catch(err)}
function fol(u){const F=FD.follows[D.me]=FD.follows[D.me]||{},p='follows/'+D.me+'/'+u;if(F[u]){delete F[u];api(p,'DELETE').catch(err)}else{F[u]=true;api(p,'PUT',true).catch(err)}R()}
function chat(){const x=($('#cx').value||'').trim().slice(0,300);if(!x)return;const k='k'+rid(),o={u:D.me,n:D.n,c:D.c,x,t:Date.now()};FD.chat[k]=o;R();api('chat/'+k,'PUT',o).catch(err)}
function del(id){if(!confirm('পোস্টটা মুছবেন?'))return;delete FD.posts[id];R();api('posts/'+id,'DELETE').catch(err)}
function cm(id){CM=CM===id?'':id;R()}
function op(id){OP=OP===id?'':id;R()}
function go(u){V=u;T='pf';R();scrollTo(0,0)}
function tab(t){T=t;V='';CM='';R();scrollTo(0,0)}
function reset(){if(!confirm('এই ফোনের প্রোফাইল মুছবেন? (পোস্ট থেকে যাবে)'))return;localStorage.removeItem(K);location.reload()}
const cmV=(id,C)=>`<div class="cm">${C.map(c=>`<div class="c">${AV(c.n,c.c,28)}<span><b>${E(c.n)}</b> ${E(c.x)}<br><span class="mu">${ago(c.t)}</span></span></div>`).join('')||'<p class="mu" style="margin:0 0 8px">এখনো কোনো মন্তব্য নেই।</p>'}<div class="row"><input id="ci" maxlength="200" placeholder="মন্তব্য লিখুন" onkeydown="if(event.key==='Enter')say('${id}')"><button class="pri" onclick="say('${id}')">পাঠান</button></div></div>`;
const acts=id=>{const L=lk(id),m=!!L[D.me];return`<footer><button class="${m?'lk':''}" onclick="like('${id}')">${m?'❤️':'🤍'} ${bd(Object.keys(L).length)}</button><button onclick="cm('${id}')">💬 ${bd(cs(id).length)}</button>${FD.posts[id]&&FD.posts[id].u===D.me?`<button onclick="del('${id}')" style="margin-left:auto">মুছুন</button>`:''}</footer>`+(CM===id?cmV(id,cs(id)):'')};
const pcard=(id,p)=>`<article class="box pc"><div class="hd" onclick="go('${E(p.u)}')">${AV(p.n,p.c)}<div><b>${E(p.n)}</b><small>${ago(p.t)}</small></div></div><p>${E(p.x)}</p>${acts(id)}</article>`;
const ncard=(id,n)=>{const art=String(n.a||n.b||'').split('\n').filter(Boolean),o=OP===id;return`<article class="box pc"><div class="mu">📰 ${E(n.tn)} · ${ago(n.t)}</div><div class="nw" onclick="op('${id}')"><b>${E(n.i)} ${E(n.h)}</b>${art.length&&!o?'<div class="mu">বিস্তারিত ›</div>':''}</div>${o&&art.length?`<div class="art">${art.map(l=>`<p>${E(l)}</p>`).join('')}</div>`:''}${acts(id)}</article>`};
const fbtn=u=>u===D.me?'':`<button class="fl ${(FD.follows[D.me]||{})[u]?'on':''}" onclick="fol('${E(u)}')">${(FD.follows[D.me]||{})[u]?'ফলো করছেন':'ফলো করুন'}</button>`;
const valid=p=>p&&p.u&&p.x&&p.t;
async function pull(){if(!fbu()||!D.me)return;try{const[u,p,n,l,c,f,ch]=await Promise.all([api('users'),api('posts','GET',undefined,Q+'60'),api('news','GET',undefined,Q+'40'),api('likes'),api('comments'),api('follows'),api('chat','GET',undefined,Q+'60')]),nx={users:u||{},posts:p||{},news:n||{},likes:l||{},comments:c||{},follows:f||{},chat:ch||{}},j=JSON.stringify(nx),was=NE;NE='';if(j!==SJ||was){SJ=j;FD=nx;if(typing())DT=1;else R()}}catch(e){if(!NE){NE='সংযোগ হয়নি। Firebase রুলস আপডেট হয়েছে কি দেখুন।';if(!typing())R()}}}
function R(){const nav=$('#nav'),app=$('#app');
if(!fbu()){nav.innerHTML='';app.innerHTML=`<div class="hero"><div class="big">আড্ডা</div><p class="mu">শুরুর আগে একবার Firebase লিংক দিন</p></div><div class="box"><div class="row"><input id="fbu" placeholder="https://…firebaseio.com"><button class="pri" onclick="setFb()">সেভ</button></div></div>`;return}
if(!D.me){nav.innerHTML='';app.innerHTML=`<div class="hero"><div class="big">আড্ডা</div><p class="mu">বন্ধুদের সাথে পোস্ট, লাইক, মন্তব্য আর চ্যাট</p></div><div class="box"><p style="margin:0 0 8px">আপনার নাম</p><input id="nm" maxlength="20" placeholder="যেমন: রবিউল"><div class="sw">${COL.map(c=>`<i class="${c===NC?'on':''}" style="background:${c}" onclick="NC='${c}';R()"></i>`).join('')}</div><button class="pri" style="width:100%" onclick="join()">শুরু করুন</button></div>`;return}
const b=(k,i,t)=>`<button class="${T===k||(T==='pf'&&k==='me'&&V===D.me)?'on':''}" onclick="${k==='me'?`go('${D.me}')`:`tab('${k}')`}"><span>${i}</span>${t}</button>`;
nav.innerHTML=b('feed','🏠','ফিড')+b('fol','👥','ফলোয়িং')+b('chat','💬','চ্যাট')+b('ppl','🔍','মানুষ')+b('me','🙂','প্রোফাইল');
let h=NE?`<p class="er">${E(NE)}</p>`:'';
if(T==='feed'||T==='fol'){const f=fl(D.me).concat(D.me);let it=Object.entries(FD.posts).filter(([i,p])=>valid(p)&&(T==='feed'||f.includes(p.u))).map(([i,p])=>({t:p.t,h:pcard(i,p)}));
if(T==='feed')it=it.concat(Object.entries(FD.news).filter(([i,n])=>n&&n.h&&n.t).map(([i,n])=>({t:n.t,h:ncard(i,n)})));
it.sort((a,b)=>b.t-a.t);
h+=`<h1>${T==='feed'?'আড্ডা':'ফলোয়িং'}</h1>`+(T==='feed'?`<div class="box"><div class="row" style="align-items:flex-start">${AV(D.n,D.c)}<textarea id="px" maxlength="280" placeholder="মনে কী চলছে, ${E(D.n)}?"></textarea></div><div class="row sp" style="margin-top:8px"><span class="mu">সর্বোচ্চ ২৮০ অক্ষর</span><button class="pri" onclick="post()">পোস্ট করুন</button></div></div>`:'')+(it.map(z=>z.h).join('')||'<p class="mu">এখানে কিছু নেই। "মানুষ" ট্যাব থেকে কাউকে ফলো করুন।</p>')}
else if(T==='chat'){const ms=Object.values(FD.chat).filter(m=>m&&m.x&&m.t).sort((a,b)=>a.t-b.t);h+=`<h1>গ্রুপ চ্যাট</h1><div id="cl">${ms.map(m=>`<div class="ms ${m.u===D.me?'me':''}">${AV(m.n,m.c,32)}<div><b style="font-size:13px">${E(m.n)}</b><br>${E(m.x)}<br><span class="mu" style="font-size:12px;color:inherit;opacity:.7">${ago(m.t)}</span></div></div>`).join('')||'<p class="mu">এখনো কেউ কিছু লেখেনি। প্রথম মেসেজটা আপনি দিন।</p>'}</div><div class="row"><input id="cx" maxlength="300" placeholder="মেসেজ লিখুন" onkeydown="if(event.key==='Enter')chat()"><button class="pri" onclick="chat()">পাঠান</button></div>`}
else if(T==='ppl'){const us=Object.entries(FD.users).filter(([k,u])=>k!==D.me&&u&&u.n);h+='<h1>মানুষ</h1>'+(us.map(([k,u])=>`<div class="box row sp"><div class="row hd" onclick="go('${E(k)}')">${AV(u.n,u.c)}<div><b>${E(u.n)}</b><br><span class="mu">${bd(fers(k).length)} ফলোয়ার</span></div></div>${fbtn(k)}</div>`).join('')||'<p class="mu">এখনো আর কেউ যোগ দেয়নি। বন্ধুদের অ্যাপ দিন।</p>')}
else{const id=V||D.me,u=id===D.me?{n:D.n,c:D.c}:who(id),ps=Object.entries(FD.posts).filter(([i,p])=>valid(p)&&p.u===id).sort((a,b)=>b[1].t-a[1].t);h+=`<div class="box"><div class="row sp"><div class="row">${AV(u.n,u.c,64)}<b style="font-size:20px">${E(u.n)}</b></div>${fbtn(id)}</div><div class="st"><div><b>${bd(ps.length)}</b><span>পোস্ট</span></div><div><b>${bd(fers(id).length)}</b><span>ফলোয়ার</span></div><div><b>${bd(fl(id).length)}</b><span>ফলোয়িং</span></div></div></div>`+(ps.map(([i,p])=>pcard(i,p)).join('')||'<p class="mu">এখনো কোনো পোস্ট নেই।</p>')+(id===D.me?'<button onclick="reset()" style="margin-top:12px;width:100%">এই ফোনের প্রোফাইল মুছুন</button>':'')}
app.innerHTML=h;if(T==='chat'){const c=$('#cl');if(c)c.lastElementChild&&c.lastElementChild.scrollIntoView({block:'end'})}}
R();pull();setInterval(()=>{pull();if(DT&&!typing()){DT=0;R()}},8000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
