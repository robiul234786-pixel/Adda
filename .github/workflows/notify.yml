name: Notify
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}
concurrency: notify
jobs:
  n:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node notify.js
        env:
          FCM_SA: ${{ secrets.FCM_SA }}
